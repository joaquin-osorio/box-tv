{

}

<script>

var playbackURL =
    "https://cdn.example.com:443/dsports/mono.m3u8?token=abc123-de-1790379102-1790361102";


var p2pConfig = {

    live: true,

    trackerZone: "us"

};


P2PEngineHls
    .tryRegisterServiceWorker(
        p2pConfig
    )
    .then(() => {

        var player =
            new Clappr.Player({

                source:
                    playbackURL,

                parentId:
                    "#player",

                poster:
                    "",

                width:
                    "100%",

                height:
                    "100%",

                autoPlay:
                    false,

                plugins:
                    [],

                mediacontrol: {

                    seekbar:
                        "#D4ED31",

                    buttons:
                        "#FFFFFF"

                }

            });


        p2pConfig.hlsjsInstance =
            player.core
                .getCurrentPlayback()
                ?._hls;


        var engine =
            new P2PEngineHls(
                p2pConfig
            );

    });

</script>
